<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5c5c"/>
      <stop offset="50%" stop-color="#ff9a5c"/>
      <stop offset="100%" stop-color="#ffd15c"/>
    </linearGradient>
    <pattern id="hex" width="52" height="45" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
      <polygon points="26,1 50,13 50,32 26,44 2,32 2,13" stroke="#ffffff" stroke-opacity="0.06" fill="none"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#hex)"/>
    <g opacity="0.9">
      <polygon points="1010,40 1062,70 1062,130 1010,160 958,130 958,70" stroke="#ff5c5c" stroke-width="2.5" fill="#ff5c5c" fill-opacity="0.12">
        <animate attributeName="fill-opacity" values="0.08;0.28;0.08" dur="4s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="1090,100 1142,130 1142,190 1090,220 1038,190 1038,130" stroke="#ff9a5c" stroke-width="2.5" fill="#ff9a5c" fill-opacity="0.12">
        <animate attributeName="fill-opacity" values="0.26;0.08;0.26" dur="4s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="930,120 982,150 982,210 930,240 878,210 878,150" stroke="#ffd15c" stroke-width="2.5" fill="#ffd15c" fill-opacity="0.12">
        <animate attributeName="fill-opacity" values="0.12;0.3;0.12" dur="5s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <rect x="64" y="72" width="6" height="116" rx="3" fill="url(#accent)"/>
    <text x="96" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b949e">~/nik-holo $ whoami</text>
    <text x="96" y="172" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3">Nik Holo<tspan fill="url(#accent)">.</tspan></text>
    <rect x="96" y="200" width="0" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.4;0.8;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="96" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">backend engineer · ruby &amp; rails by day · swift &amp; pixels by night</text>
  </g>
</svg>
